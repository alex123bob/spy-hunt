# Builds the frontend and publishes dist/ as a GitHub Release asset. Runs when a version tag (v*) is pushed,
# or manually from the Actions tab ("Run workflow"): with the tag left empty it releases v<package.json version>
# from the branch you pick, creating the tag if it does not exist yet.
# The server has no Node, so it just downloads spy-hunt-dist.tar.gz (see scripts/server-deploy.sh).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.1 (leave empty to use the version in package.json)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build (served from /spy-hunt/ in production)
        run: yarn build
        env:
          VITE_BASE_PATH: /spy-hunt
      - name: Package dist
        run: tar -czf spy-hunt-dist.tar.gz -C dist .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${INPUT_TAG:-v$(node -p "require('./package.json').version")}"
          fi
          case "$TAG" in v[0-9]*) ;; *) echo "Invalid tag '$TAG', expected something like v0.1.1"; exit 1;; esac
          # --target only matters when the tag does not exist yet: it is created at the commit being built
          gh release create "$TAG" spy-hunt-dist.tar.gz --title "$TAG" --generate-notes --target "$GITHUB_SHA"
